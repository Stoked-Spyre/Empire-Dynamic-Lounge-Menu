<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Empire Hookah Lounge — Welcome</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000000;
      color: #F4F4F5;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .font-crest { font-family: 'Playfair Display', serif; }

    /* ========================================================================== */
    /* EXACT MENU NOIR SKYLINE BACKGROUND                                        */
    /* ========================================================================== */
    .menu-skyline-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .menu-skyline-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 38%;
      opacity: 0.15;
      filter: contrast(1.1) brightness(0.85);
    }
    .menu-skyline-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 30%, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.55) 65%, #000000 95%),
        linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 25%, rgba(0,0,0,0.65) 75%, #000000 100%);
    }

    @media (max-width: 640px) {
      .menu-skyline-img {
        opacity: 0.18;
        object-position: center 35%;
      }
    }

    /* ========================================================================== */
    /* TOP HEADER & VIP PILL                                                      */
    /* ========================================================================== */
    .landing-header {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 44rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 1.25rem 1.25rem 0 1.25rem;
    }
    .vip-badge-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #E5A93C;
      color: #000000;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 2px 14px rgba(229, 169, 60, 0.35);
      transition: all 0.15s ease;
      cursor: pointer;
      text-decoration: none;
    }
    .vip-badge-btn:hover {
      background: #F5BA4C;
      box-shadow: 0 4px 20px rgba(229, 169, 60, 0.6);
      transform: translateY(-1px);
    }

    /* ========================================================================== */
    /* CENTER BRAND MASTHEAD WITH FLOATING LEVITATION                             */
    /* ========================================================================== */
    .landing-center {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 42rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: auto;
      margin-bottom: auto;
      padding: 0 1rem;
    }

    .landing-logo {
      width: 4.75rem;
      height: 4.75rem;
      object-fit: contain;
      margin: 0 auto 0.4rem auto;
      mix-blend-mode: screen;
      filter: drop-shadow(0 4px 20px rgba(229, 169, 60, 0.28));
      animation: logo-float 4.8s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes logo-float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-7px); }
    }

    .landing-masthead {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.85rem, 5.5vw, 2.35rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #FFFFFF;
      margin-bottom: 0.2rem;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.2);
    }

    .landing-kicker {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      color: #E2E8F0;
    }

    /* ========================================================================== */
    /* TRANSPARENT NOIR HOUSE REGULATIONS & SILVER ANIMATED BUTTON               */
    /* ========================================================================== */
    .landing-footer-hud {
      position: relative;
      z-index: 10;
      width: calc(100% - 24px);
      max-width: 380px;
      margin-bottom: max(18px, env(safe-area-inset-bottom, 18px));
    }

    .transparent-card {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 14px 16px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 2px;
    }
    .card-title-text {
      font-family: 'Playfair Display', serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #E2E8F0;
    }
    .card-divider-line {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .policy-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      transition: background 0.15s ease;
    }
    .policy-row:hover {
      background: rgba(255, 255, 255, 0.04);
    }
    .policy-badge {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: rgba(229, 169, 60, 0.12);
      border: 1px solid rgba(229, 169, 60, 0.4);
      color: #E5A93C;
      font-family: 'Playfair Display', serif;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .policy-text {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }
    .policy-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.02em;
    }
    .policy-sub {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.62rem;
      color: #94A3B8;
      font-style: italic;
      font-weight: 300;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .policy-link {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.64rem;
      font-weight: 600;
      color: #E5A93C;
      text-decoration: underline;
      text-underline-offset: 2px;
      margin-left: 2px;
      flex-shrink: 0;
    }
    .policy-link:hover {
      color: #F5BA4C;
    }

    /* Silver Metallic Shimmer Animated Button */
    .enter-silver-btn {
      position: relative;
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 45%, #cbd5e1 75%, #94a3b8 100%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      color: #09090b;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15), 0 2px 8px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .enter-silver-btn:hover {
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 45%, #e2e8f0 75%, #cbd5e1 100%);
      box-shadow: 0 6px 28px rgba(255, 255, 255, 0.25), 0 4px 12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 1);
      transform: translateY(-1px);
    }
    .enter-silver-btn:active {
      transform: scale(0.985);
    }
    .enter-silver-btn::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 45%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.7) 50%, transparent);
      transform: translate3d(-140%, 0, 0) skewX(-20deg);
      animation: silver-sweep 3.6s cubic-bezier(.66, 0, .16, 1) infinite;
      pointer-events: none;
    }
    @keyframes silver-sweep {
      0%   { transform: translate3d(-140%, 0, 0) skewX(-20deg); }
      40%  { transform: translate3d(360%, 0, 0) skewX(-20deg); }
      100% { transform: translate3d(360%, 0, 0) skewX(-20deg); }
    }
  </style>
</head>
<body>

  <!-- ==================== PURE NOIR SKYLINE BACKDROP ==================== -->
  <div class="menu-skyline-bg" aria-hidden="true">
    <img src="images/skyline_sketch.jpg" alt="" class="menu-skyline-img" />
    <div class="menu-skyline-overlay"></div>
  </div>

  <!-- ==================== TOP VIP BADGE ==================== -->
  <header class="landing-header">
    <a href="index.html" class="vip-badge-btn">
      <span>👑 VIP</span>
    </a>
  </header>

  <!-- ==================== CENTER BRAND SPREAD WITH FLOATING LOGO ==================== -->
  <main class="landing-center">
    <img src="logos/empire_clean.png" alt="Empire Hookah Lounge" class="landing-logo" />
    <h1 class="landing-masthead">Empire Hookah Lounge</h1>
    <p class="landing-kicker">EST. 2010 · PHOENIX, ARIZONA</p>
  </main>

  <!-- ==================== TRANSPARENT HOUSE REGULATIONS & SILVER CTA ==================== -->
  <footer class="landing-footer-hud">
    <div class="transparent-card">
      <div class="card-header-row">
        <span class="card-divider-line"></span>
        <span class="card-title-text">House Regulations</span>
        <span class="card-divider-line"></span>
      </div>

      <div class="space-y-1.5">
        <!-- Rule 1: 21+ Age -->
        <div class="policy-row">
          <div class="policy-badge">21+</div>
          <div class="policy-text">
            <span class="policy-heading">Age Requirement</span>
            <span class="policy-sub">Minimum 21+ of age with valid physical ID</span>
          </div>
          <a href="https://www.fda.gov/tobacco-products/retail-sales-tobacco-products/tobacco-21" target="_blank" rel="noopener noreferrer" class="policy-link" title="Federal Tobacco 21 Law">Law ↗</a>
        </div>

        <!-- Rule 2: 2 Guests Max -->
        <div class="policy-row">
          <div class="policy-badge">2P</div>
          <div class="policy-text">
            <span class="policy-heading">Pipe Capacity</span>
            <span class="policy-sub">Maximum 2 guests per handcrafted hookah pipe</span>
          </div>
        </div>

        <!-- Rule 3: No Outside Drinks -->
        <div class="policy-row">
          <div class="policy-badge">NB</div>
          <div class="policy-text">
            <span class="policy-heading">Outside Beverages</span>
            <span class="policy-sub">No outside beverages or containers permitted</span>
          </div>
        </div>
      </div>

      <a href="index.html" class="enter-silver-btn">
        <span>Enter Lounge Menu</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </div>
  </footer>

</body>
</html>
