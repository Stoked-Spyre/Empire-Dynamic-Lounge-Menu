<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Empire Hookah Lounge — Welcome</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000000;
      color: #F4F4F5;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .font-crest { font-family: 'Playfair Display', serif; }
    .font-mono-nums { font-variant-numeric: tabular-nums; }

    /* ========================================================================== */
    /* EXACT MENU NOIR SKYLINE BACKGROUND                                        */
    /* ========================================================================== */
    .menu-skyline-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .menu-skyline-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 38%;
      opacity: 0.15;
      filter: contrast(1.1) brightness(0.85);
    }
    .menu-skyline-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 30%, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.55) 65%, #000000 95%),
        linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 25%, rgba(0,0,0,0.65) 75%, #000000 100%);
    }

    @media (max-width: 640px) {
      .menu-skyline-img {
        opacity: 0.18;
        object-position: center 35%;
      }
    }

    /* ========================================================================== */
    /* CENTER BRAND MASTHEAD WITH 60FPS GPU FLOATING LOGO                         */
    /* ========================================================================== */
    .landing-center {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 42rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: auto;
      margin-bottom: auto;
      padding: 0 1rem;
    }

    .landing-logo-wrap {
      width: 9.5rem;
      height: 9.5rem;
      margin: 0 auto 0.75rem auto;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      animation: logo-float 6.5s ease-in-out infinite;
    }
    .landing-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      mix-blend-mode: screen;
      filter: drop-shadow(0 4px 24px rgba(229, 169, 60, 0.35));
    }
    @keyframes logo-float {
      0%, 100% { transform: translate3d(0, 0px, 0); }
      50%      { transform: translate3d(0, -8px, 0); }
    }

    .landing-masthead {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.85rem, 5.5vw, 2.35rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #FFFFFF;
      margin-bottom: 0.2rem;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.2);
    }

    .landing-kicker {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      color: #E2E8F0;
    }

    /* ========================================================================== */
    /* FULLY TRANSPARENT EDITORIAL REGULATIONS & GOLD LINED BUTTON                */
    /* ========================================================================== */
    .landing-footer-hud {
      position: relative;
      z-index: 10;
      width: calc(100% - 32px);
      max-width: 380px;
      margin-bottom: max(28px, env(safe-area-inset-bottom, 28px));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .reg-header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .reg-title-text {
      font-family: 'Playfair Display', serif;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #E2E8F0;
    }
    .reg-divider-line {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.15);
    }

    .reg-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
    }
    .reg-badge-tag {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      color: #E5A93C;
      letter-spacing: 0.05em;
    }
    .reg-name {
      font-family: 'Playfair Display', serif;
      font-size: 0.92rem;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.02em;
    }
    .reg-law-link {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      color: #E5A93C;
      text-decoration: underline;
      text-underline-offset: 2px;
      flex-shrink: 0;
      transition: color 0.15s ease;
    }
    .reg-law-link:hover {
      color: #F5BA4C;
    }

    /* Button: Line Above and Below with Gold Font & Soft Glow */
    .landing-enter-line-btn {
      position: relative;
      width: 100%;
      padding: 13px 0;
      background: transparent;
      border: none;
      border-top: 1px solid rgba(229, 169, 60, 0.45);
      border-bottom: 1px solid rgba(229, 169, 60, 0.45);
      color: #E5A93C;
      font-family: 'Playfair Display', serif;
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-shadow: 0 0 12px rgba(229, 169, 60, 0.45);
      transition: all 0.25s ease;
      text-decoration: none;
      margin-top: 6px;
    }
    .landing-enter-line-btn:hover {
      color: #FFFFFF;
      border-top-color: rgba(229, 169, 60, 0.85);
      border-bottom-color: rgba(229, 169, 60, 0.85);
      text-shadow: 0 0 16px rgba(229, 169, 60, 0.8), 0 0 24px rgba(229, 169, 60, 0.4);
      letter-spacing: 0.32em;
    }
    .landing-enter-line-btn:active {
      transform: scale(0.985);
      opacity: 0.85;
    }

    /* Page Fade Transition Container */
    #landingContainer {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transition: opacity 0.5s ease;
    }
    #landingContainer.fading {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- ==================== PURE NOIR SKYLINE BACKDROP ==================== -->
  <div class="menu-skyline-bg" aria-hidden="true">
    <img src="images/skyline_sketch.jpg" alt="" class="menu-skyline-img" />
    <div class="menu-skyline-overlay"></div>
  </div>

  <div id="landingContainer">
    <!-- Empty top spacer (VIP button removed as requested) -->
    <header class="w-full h-8"></header>

    <!-- ==================== CENTER BRAND SPREAD WITH 60FPS FLOATING LOGO ==================== -->
    <main class="landing-center">
      <div class="landing-logo-wrap">
        <img src="logos/empire_clean.png" alt="Empire Hookah Lounge" class="landing-logo-img" />
      </div>
      <h1 class="landing-masthead">Empire Hookah Lounge</h1>
      <p class="landing-kicker">EST. 2010 · PHOENIX, ARIZONA</p>
    </main>

    <!-- ==================== FULLY TRANSPARENT REGULATIONS & GOLD LINED CTA ==================== -->
    <footer class="landing-footer-hud">
      <div class="reg-header-row">
        <span class="reg-divider-line"></span>
        <span class="reg-title-text">Lounge Policies</span>
        <span class="reg-divider-line"></span>
      </div>

      <div class="space-y-2.5">
        <!-- Rule 1: 21+ Age -->
        <div class="reg-item-row">
          <div class="flex items-baseline gap-2.5">
            <span class="reg-badge-tag">21+</span>
            <span class="reg-name">Age Requirement</span>
          </div>
          <a href="https://www.fda.gov/tobacco-products/retail-sales-tobacco-products/tobacco-21" target="_blank" rel="noopener noreferrer" class="reg-law-link" title="Federal Tobacco 21 Law">Law ↗</a>
        </div>

        <!-- Rule 2: 2 People per Pipe -->
        <div class="reg-item-row">
          <div class="flex items-baseline gap-2.5">
            <span class="reg-badge-tag">2P</span>
            <span class="reg-name">2 People per Pipe</span>
          </div>
        </div>

        <!-- Rule 3: NO Outside Beverages -->
        <div class="reg-item-row">
          <div class="flex items-baseline gap-2.5">
            <span class="reg-badge-tag">NO</span>
            <span class="reg-name">Outside Beverages</span>
          </div>
        </div>
      </div>

      <!-- Button with Top/Bottom Line, Gold Text & Soft Glow -->
      <a href="index.html" onclick="navigateWithFade(event)" class="landing-enter-line-btn">
        <span>Enter Lounge Menu</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </footer>
  </div>

  <script>
    function navigateWithFade(e) {
      e.preventDefault();
      const container = document.getElementById('landingContainer');
      if (container) {
        container.classList.add('fading');
      }
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 450);
    }
  </script>
</body>
</html>
