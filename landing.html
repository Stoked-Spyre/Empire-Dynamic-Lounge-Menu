<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Empire Hookah Lounge — Welcome</title>
  
  <!-- PWA & Mobile Web App Manifest -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Google Fonts: Playfair Display (Serif Masthead) & Plus Jakarta Sans (Modern Editorial) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,800;1,300&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       1. GLOBAL RESET & BASE STYLES
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      background-color: #000000;
      color: #F4F4F5;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ==========================================================================
       2. NOIR SKYLINE BACKDROP (Exact Menu Match)
       ========================================================================== */
    .menu-skyline-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .menu-skyline-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 38%;
      opacity: 0.15;
      filter: contrast(1.1) brightness(0.85);
    }

    .menu-skyline-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 30%, rgba(0, 0, 0, 0.05) 0%, rgba(0, 0, 0, 0.55) 65%, #000000 95%),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.5) 0%, transparent 25%, rgba(0, 0, 0, 0.65) 75%, #000000 100%);
    }

    /* ==========================================================================
       3. VIEWPORT CONTAINER & SMOOTH FADE TRANSITION
       ========================================================================== */
    #landingContainer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(48px, calc(env(safe-area-inset-top, 24px) + 24px)) 1.25rem max(24px, env(safe-area-inset-bottom, 20px)) 1.25rem;
      transition: opacity 0.5s ease;
      overflow: hidden;
    }

    #landingContainer.fading-out {
      opacity: 0;
      pointer-events: none;
    }

    /* ==========================================================================
       4. CENTER BRAND MASTHEAD & 60FPS FLOATING CREST
       ========================================================================== */
    .landing-center {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 42rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto 0;
      padding: clamp(0.5rem, 2vh, 1.5rem) 0.5rem 0 0.5rem;
      transition: transform 0.3s ease;
    }

    /* Floating Logo Container (GPU Hardware-Accelerated) */
    .landing-logo-wrap {
      width: clamp(6rem, 15vh, 9rem);
      height: clamp(6rem, 15vh, 9rem);
      margin: 0 auto clamp(0.25rem, 1vh, 0.65rem) auto;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      animation: logo-float 6.5s ease-in-out infinite;
    }

    .landing-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      mix-blend-mode: screen;
      filter: drop-shadow(0 4px 24px rgba(229, 169, 60, 0.35));
    }

    @keyframes logo-float {
      0%, 100% { transform: translate3d(0, 0px, 0); }
      50%      { transform: translate3d(0, -6px, 0); }
    }

    /* Masthead Brand Titles (Matching Approved Menu Typography) */
    .menu-masthead {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.75rem, 4.2vh, 2.1rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #FFFFFF;
      margin-bottom: 0.2rem;
      line-height: 1.15;
    }

    .menu-kicker {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      color: #E2E8F0;
      margin-bottom: 0.25rem;
    }

    /* ==========================================================================
       5. LOUNGE POLICIES (Fully Transparent Editorial Typography)
       ========================================================================== */
    .landing-footer-hud {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.8vh, 16px);
      padding: 0 0.5rem;
    }

    .policy-header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .policy-title-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(0.7rem, 1.4vh, 0.78rem);
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #E2E8F0;
    }

    .policy-divider-line {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.15);
    }

    .policy-item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .policy-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 2px 0;
    }

    .policy-label-group {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .policy-badge-tag {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(0.68rem, 1.3vh, 0.74rem);
      font-weight: 800;
      color: #E5A93C;
      letter-spacing: 0.05em;
    }

    .policy-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(0.85rem, 1.8vh, 0.94rem);
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.02em;
    }

    .policy-law-link {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(0.64rem, 1.3vh, 0.7rem);
      font-weight: 600;
      color: #E5A93C;
      text-decoration: underline;
      text-underline-offset: 2px;
      flex-shrink: 0;
      transition: color 0.15s ease;
    }

    .policy-law-link:hover {
      color: #F5BA4C;
    }

    /* ==========================================================================
       6. GOLD-LINED ENTER CTA BUTTON
       ========================================================================== */
    .landing-enter-line-btn {
      position: relative;
      width: 100%;
      padding: clamp(10px, 1.6vh, 14px) 0;
      background: transparent;
      border: none;
      border-top: 1px solid rgba(229, 169, 60, 0.45);
      border-bottom: 1px solid rgba(229, 169, 60, 0.45);
      color: #E5A93C;
      font-family: 'Playfair Display', serif;
      font-size: clamp(0.78rem, 1.6vh, 0.86rem);
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-shadow: 0 0 12px rgba(229, 169, 60, 0.45);
      transition: all 0.25s ease;
      text-decoration: none;
      margin-top: 4px;
    }

    .landing-enter-line-btn:hover {
      color: #FFFFFF;
      border-top-color: rgba(229, 169, 60, 0.85);
      border-bottom-color: rgba(229, 169, 60, 0.85);
      text-shadow: 0 0 16px rgba(229, 169, 60, 0.8), 0 0 24px rgba(229, 169, 60, 0.4);
      letter-spacing: 0.32em;
    }

    .landing-enter-line-btn:active {
      transform: scale(0.985);
      opacity: 0.85;
    }

    /* ==========================================================================
       7. DESKTOP VIEWPORT ELEVATION (-160px)
       ========================================================================== */
    @media (min-width: 768px) {
      .landing-center {
        transform: translateY(-160px);
        padding-top: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Background: Charcoal Sketch Skyline with Vignette Overlay -->
  <div class="menu-skyline-bg" aria-hidden="true">
    <img src="images/skyline_sketch.jpg" alt="" class="menu-skyline-img" />
    <div class="menu-skyline-overlay"></div>
  </div>

  <!-- Primary Interactive Landing Viewport -->
  <div id="landingContainer">

    <!-- Center Brand Masthead -->
    <main class="landing-center">
      <div class="landing-logo-wrap">
        <img src="logos/empire_clean.png" alt="Empire Hookah Lounge Crest" class="landing-logo-img" />
      </div>
      <h1 class="menu-masthead">Empire Hookah Lounge</h1>
      <p class="menu-kicker">EST. 2010 · PHOENIX, ARIZONA</p>
    </main>

    <!-- Lounge Policies & Enter CTA -->
    <footer class="landing-footer-hud">
      <div class="policy-header-row">
        <span class="policy-divider-line"></span>
        <h2 class="policy-title-text">Lounge Policies</h2>
        <span class="policy-divider-line"></span>
      </div>

      <div class="policy-item-list">
        <!-- Policy 1: Age Requirement -->
        <div class="policy-item-row">
          <div class="policy-label-group">
            <span class="policy-badge-tag">21+</span>
            <span class="policy-name">Age Requirement</span>
          </div>
          <a 
            href="https://www.fda.gov/tobacco-products/retail-sales-tobacco-products/tobacco-21" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="policy-law-link" 
            title="Federal Tobacco 21 Law"
          >
            Law ↗
          </a>
        </div>

        <!-- Policy 2: Pipe Capacity -->
        <div class="policy-item-row">
          <div class="policy-label-group">
            <span class="policy-badge-tag">2P</span>
            <span class="policy-name">2 People per Pipe</span>
          </div>
        </div>

        <!-- Policy 3: Outside Beverages -->
        <div class="policy-item-row">
          <div class="policy-label-group">
            <span class="policy-badge-tag">NO</span>
            <span class="policy-name">Outside Beverages</span>
          </div>
        </div>
      </div>

      <!-- Action Button -->
      <a href="index.html" onclick="enterMenuWithFade(event)" class="landing-enter-line-btn">
        <span>Enter Lounge Menu</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </a>
    </footer>

  </div>

  <!-- Page Navigation Script -->
  <script>
    /**
     * Smoothly dissolves the landing view before navigating to the main menu spread.
     */
    function enterMenuWithFade(event) {
      event.preventDefault();
      const container = document.getElementById('landingContainer');
      if (container) {
        container.classList.add('fading-out');
      }
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 450);
    }
  </script>
</body>
</html>
