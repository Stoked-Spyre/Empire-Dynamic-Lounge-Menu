<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Empire Hookah Lounge — Mix Lab &amp; Ordering</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#090C12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#E5A93C',
              accent: '#A855F7',
              darkBg: '#090C12',
              cardBg: '#121622',
              cardBorder: '#1F283D',
              coal: '#FF4141'
            }
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090C12;
      color: #E2E8F0;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.14), transparent 50%),
        radial-gradient(circle at 100% 70%, rgba(229, 169, 60, 0.08), transparent 45%);
      background-attachment: fixed;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-crest {
      font-family: 'Cinzel', serif;
    }
    .font-mono-nums {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-card {
      background: rgba(18, 22, 34, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    /* 3D MECHANICAL ROTARY CYLINDER WHEEL DRUM (Inspired by Stoked Lab) */
    .cylinder-wheel-container {
      position: relative;
      width: 100%;
      height: 220px;
      overflow: hidden;
      perspective: 900px;
      touch-action: none;
      cursor: grab;
    }
    .cylinder-wheel-container:active {
      cursor: grabbing;
    }
    .cylinder-drum-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }
    .cylinder-target-slot {
      position: absolute;
      top: 50%;
      left: 12px;
      right: 12px;
      height: 52px;
      transform: translateY(-50%);
      background: rgba(168, 85, 247, 0.12);
      border-top: 1.5px solid rgba(168, 85, 247, 0.6);
      border-bottom: 1.5px solid rgba(168, 85, 247, 0.6);
      border-radius: 12px;
      pointer-events: none;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.25), inset 0 0 10px rgba(168, 85, 247, 0.15);
      z-index: 5;
    }
    .cylinder-drum-track {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      margin-top: -26px;
      transform-style: preserve-3d;
    }
    .cylinder-item-row {
      position: absolute;
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border: none;
      background: transparent;
      color: #E2E8F0;
      font-size: 0.92rem;
      font-weight: 700;
      transform-origin: center center -120px;
      transition: opacity 0.12s ease, transform 0.1s ease;
      cursor: pointer;
    }
    .cylinder-item-row.active {
      color: #FFFFFF;
      font-weight: 800;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    }
    .cylinder-color-bar {
      width: 5px;
      height: 24px;
      border-radius: 4px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    /* Gradient Ribbon */
    .spectrum-track {
      height: 10px;
      border-radius: 999px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 12px rgba(168,85,247,0.2);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

  <!-- ==================== JAVASCRIPT & 3D ROTARY WHEEL ENGINE ==================== -->
  <script>
    // Master Russian & Tangiers Flavor Catalog
    const CATALOG = [
      { id: 'mh-pinkman', name: 'Pinkman', brand: 'MustHave', color: '#EC4899', strength: 7, desc: 'Raspberry, Grapefruit & Strawberry', profile: ['Berry', 'Citrus'] },
      { id: 'tan-cane-mint', name: 'Cane Mint (Noir)', brand: 'Tangiers', color: '#10B981', strength: 9, desc: 'Natural Sweet Cane Peppermint', profile: ['Mint', 'Heavy'] },
      { id: 'ds-falling-star', name: 'Falling Star', brand: 'Darkside', color: '#F59E0B', strength: 8, desc: 'Passionfruit & Mango Medley', profile: ['Fruity'] },
      { id: 'bb-green-tea', name: 'Green Tea', brand: 'BlackBurn', color: '#84CC16', strength: 8, desc: 'Jasmine Green Tea Herbal Leaf', profile: ['Tea'] },
      { id: 'tan-kashmir-peach', name: 'Kashmir Peach', brand: 'Tangiers', color: '#FB923C', strength: 9, desc: 'Spiced Floral Kashmir & Peach', profile: ['Spiced', 'Heavy'] },
      { id: 'mh-frosty', name: 'Frosty', brand: 'MustHave', color: '#38BDF8', strength: 6, desc: 'Pure Sub-Zero Siberian Chill', profile: ['Ice'] },
      { id: 'el-waffle', name: 'Belgian Waffle', brand: 'Element', color: '#D97706', strength: 7, desc: 'Caramelized Butter & Waffle Dough', profile: ['Dessert'] },
      { id: 'ds-supernova', name: 'Supernova', brand: 'Darkside', color: '#6366F1', strength: 9, desc: 'The Deepest Freeze in Shisha', profile: ['Extreme Ice'] }
    ];

    const AVATARS = [
      "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80",
      "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&q=80",
      "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=120&q=80",
      "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=120&q=80"
    ];

    // State
    let userAccount = {
      name: 'Alex',
      handle: '@alex_ehl',
      phone: '(602) 555-0199',
      avatar: AVATARS[0]
    };
    let currentTable = { num: 6, name: 'VIP Lounge Couch', pin: '6010' };
    let activeFlavors = [
      { id: 'mh-pinkman', percent: 70 },
      { id: 'tan-cane-mint', percent: 30 }
    ];
    let bowl = { id: 'phunnel', price: 35, grams: 22, name: 'Oblako Phunnel' };

    // Rotary Wheel State
    let selectedBrandFilter = 'all';
    let filteredWheelItems = [];
    let wheelSelectedIndex = 0;
    let touchStartY = null;
    let touchAccumulator = 0;

    function renderIcons() {
      if (window.lucide) lucide.createIcons();
    }

    // ==================== 3D ROTARY CYLINDER WHEEL CONTROLLER ====================
    function initRotaryWheel() {
      // Build brand filter tabs
      const brands = ['all', 'MustHave', 'Tangiers', 'Darkside', 'BlackBurn', 'Element'];
      const tabsContainer = document.getElementById('wheelBrandTabs');
      tabsContainer.innerHTML = '';

      brands.forEach(b => {
        const btn = document.createElement('button');
        const isActive = (b === selectedBrandFilter);
        btn.className = `text-[10px] font-bold px-2.5 py-1 rounded-full whitespace-nowrap transition ${isActive ? 'bg-purple-600 text-white' : 'bg-slate-900 text-slate-400 hover:text-white'}`;
        btn.textContent = b === 'all' ? 'All Brands' : b;
        btn.onclick = () => {
          selectedBrandFilter = b;
          wheelSelectedIndex = 0;
          initRotaryWheel();
        };
        tabsContainer.appendChild(btn);
      });

      filteredWheelItems = CATALOG.filter(item => selectedBrandFilter === 'all' || item.brand === selectedBrandFilter);
      renderDrumTrack();
    }

    function renderDrumTrack() {
      const track = document.getElementById('cylinderDrumTrack');
      track.innerHTML = '';

      const count = filteredWheelItems.length;
      if (count === 0) return;

      filteredWheelItems.forEach((item, index) => {
        const diff = index - wheelSelectedIndex;
        const isSelected = index === wheelSelectedIndex;
        const isVisible = Math.abs(diff) <= 3;
        if (!isVisible) return;

        // 3D Cylinder Mathematics
        const yOffset = diff * 48;
        const scale = isSelected ? 1 : Math.max(0.78, 1 - Math.abs(diff) * 0.08);
        const opacity = isSelected ? 1 : Math.max(0.25, 1 - Math.abs(diff) * 0.28);
        const rotateX = diff * -14;

        const row = document.createElement('button');
        row.type = 'button';
        row.className = `cylinder-item-row ${isSelected ? 'active' : ''}`;
        row.style.transform = `translate3d(0, ${yOffset}px, 0) rotateX(${rotateX}deg) scale(${scale})`;
        row.style.opacity = opacity;

        row.onclick = () => {
          if (isSelected) {
            confirmWheelSelection();
          } else {
            wheelSelectedIndex = index;
            renderDrumTrack();
          }
        };

        row.innerHTML = `
          <div class="flex items-center min-w-0">
            <span class="cylinder-color-bar" style="background: ${item.color};"></span>
            <span class="truncate">${item.name}</span>
          </div>
          <div class="flex items-center gap-1.5 flex-shrink-0">
            <span class="text-[10px] bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded font-bold">${item.brand}</span>
            <span class="text-[10px] text-purple-300 font-bold">Str ${item.strength}</span>
          </div>
        `;
        track.appendChild(row);
      });

      // Update button text
      const activeItem = filteredWheelItems[wheelSelectedIndex];
      if (activeItem) {
        document.getElementById('wheelConfirmBtnText').textContent = `+ Add "${activeItem.name}" to Mix`;
      }
    }

    // Touch & Wheel Event Handlers for 3D Drum
    function handleWheelScroll(e) {
      e.preventDefault();
      const count = filteredWheelItems.length;
      if (count === 0) return;
      if (e.deltaY > 0 && wheelSelectedIndex < count - 1) {
        wheelSelectedIndex++;
        renderDrumTrack();
      } else if (e.deltaY < 0 && wheelSelectedIndex > 0) {
        wheelSelectedIndex--;
        renderDrumTrack();
      }
    }

    function handleTouchStart(e) {
      touchStartY = e.touches[0].clientY;
      touchAccumulator = 0;
    }

    function handleTouchMove(e) {
      if (touchStartY === null) return;
      const currentY = e.touches[0].clientY;
      const delta = touchStartY - currentY;
      touchStartY = currentY;
      touchAccumulator += delta;

      const step = 32;
      const count = filteredWheelItems.length;
      if (touchAccumulator > step && wheelSelectedIndex < count - 1) {
        wheelSelectedIndex++;
        touchAccumulator = 0;
        renderDrumTrack();
      } else if (touchAccumulator < -step && wheelSelectedIndex > 0) {
        wheelSelectedIndex--;
        touchAccumulator = 0;
        renderDrumTrack();
      }
    }

    function handleTouchEnd() {
      touchStartY = null;
      touchAccumulator = 0;
    }

    // Confirm Wheel Selection
    function confirmWheelSelection() {
      const activeItem = filteredWheelItems[wheelSelectedIndex];
      if (!activeItem) return;

      const existing = activeFlavors.find(f => f.id === activeItem.id);
      if (existing) {
        showToast('ℹ️ Already in Mix', `${activeItem.name} is already in your bowl.`);
        return;
      }

      if (activeFlavors.length >= 3) {
        // Replace last flavor
        activeFlavors[activeFlavors.length - 1].id = activeItem.id;
        showToast('🔄 Swapped', `Replaced slot with ${activeItem.name}.`);
      } else {
        activeFlavors.push({ id: activeItem.id, percent: 30 });
        const split = Math.floor(100 / activeFlavors.length);
        activeFlavors.forEach((f, i) => {
          f.percent = (i === 0) ? (100 - split * (activeFlavors.length - 1)) : split;
        });
        showToast('✨ Added to Bowl', `${activeItem.name} slotted into mix.`);
      }

      renderMixSummary();
    }

    // ==================== MIX LAB RENDERING ====================
    function renderMixSummary() {
      // 1. Build Gradient
      const ribbon = document.getElementById('spectrumRibbon');
      let gradParts = [];
      let cum = 0;
      activeFlavors.forEach(f => {
        const item = CATALOG.find(c => c.id === f.id) || CATALOG[0];
        const col = item ? item.color : '#8B5CF6';
        const start = cum;
        cum += f.percent;
        gradParts.push(`${col} ${start}% ${cum}%`);
      });
      ribbon.style.background = `linear-gradient(90deg, ${gradParts.join(', ')})`;

      // 2. Render Slots
      const container = document.getElementById('flavorSlotsContainer');
      container.innerHTML = '';

      let totalStrength = 0;
      activeFlavors.forEach((slot, index) => {
        const item = CATALOG.find(c => c.id === slot.id);
        if (!item) return;

        totalStrength += (item.strength * (slot.percent / 100));
        const grams = ((bowl.grams * slot.percent) / 100).toFixed(1);

        const row = document.createElement('div');
        row.className = 'bg-slate-950/80 border border-slate-800 rounded-xl p-2 flex items-center justify-between gap-2.5';
        row.innerHTML = `
          <div class="flex items-center gap-2 min-w-0 flex-1">
            <span class="w-1.5 h-6 rounded-full" style="background: ${item.color};"></span>
            <div class="truncate">
              <div class="flex items-center gap-1">
                <span class="text-xs font-bold text-white truncate">${item.name}</span>
                <span class="text-[9px] bg-slate-800 text-slate-400 px-1 py-0.2 rounded">${item.brand}</span>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-1.5">
            <div class="text-right">
              <span class="text-xs font-bold text-brand-gold font-mono-nums">${slot.percent}%</span>
              <span class="text-[9px] text-slate-500 block font-mono-nums">${grams}g</span>
            </div>
            
            <div class="flex items-center bg-slate-900 rounded-lg p-0.5 border border-slate-800">
              <button onclick="adjustPercent(${index}, -5)" class="w-5 h-5 text-xs font-bold bg-slate-800 text-slate-300 rounded">-</button>
              <button onclick="adjustPercent(${index}, 5)" class="w-5 h-5 text-xs font-bold bg-slate-800 text-slate-300 rounded">+</button>
            </div>

            <button onclick="removeFlavor(${index})" class="text-slate-500 hover:text-red-400 p-1">
              <i data-lucide="trash-2" class="w-3 h-3"></i>
            </button>
          </div>
        `;
        container.appendChild(row);
      });

      // 3. Update Buzz Badge
      const roundedStr = (totalStrength).toFixed(1);
      document.getElementById('buzzBadge').textContent = `${roundedStr}/10 ${roundedStr >= 8 ? 'HEAVY BUZZ' : 'DARK LEAF'}`;
      document.getElementById('totalGramsSummary').textContent = `${bowl.grams}g • 100%`;
      document.getElementById('totalPriceText').textContent = `$${bowl.price.toFixed(2)}`;

      renderIcons();
    }

    function adjustPercent(index, delta) {
      if (activeFlavors.length === 1) return;
      let cur = activeFlavors[index].percent;
      let next = Math.max(10, Math.min(90, cur + delta));
      if (next === cur) return;

      const diff = next - cur;
      activeFlavors[index].percent = next;
      const otherCount = activeFlavors.length - 1;
      const otherDelta = -(diff / otherCount);

      activeFlavors.forEach((f, i) => {
        if (i !== index) f.percent = Math.round(f.percent + otherDelta);
      });

      let sum = activeFlavors.reduce((a, b) => a + b.percent, 0);
      if (sum !== 100) {
        activeFlavors[index === 0 ? 1 : 0].percent += (100 - sum);
      }
      renderMixSummary();
    }

    function removeFlavor(index) {
      if (activeFlavors.length <= 1) {
        showToast('⚠️ Bowl Requirement', 'Must have at least 1 flavor in your bowl.');
        return;
      }
      activeFlavors.splice(index, 1);
      const split = Math.floor(100 / activeFlavors.length);
      activeFlavors.forEach((f, i) => {
        f.percent = (i === 0) ? (100 - split * (activeFlavors.length - 1)) : split;
      });
      renderMixSummary();
    }

    function selectBowlType(id, price, name, grams) {
      bowl = { id, price, name, grams };
      document.querySelectorAll('.bowl-pill').forEach(b => {
        b.classList.remove('border-2', 'border-purple-500', 'bg-purple-500/15');
        b.classList.add('border', 'border-slate-800', 'bg-slate-900/60');
      });
      const active = document.getElementById(`bowl-${id}`);
      if (active) {
        active.classList.add('border-2', 'border-purple-500', 'bg-purple-500/15');
        active.classList.remove('border', 'border-slate-800', 'bg-slate-900/60');
      }
      renderMixSummary();
    }

    // ==================== DISPATCH & COALS ====================
    function sendOrder(mode) {
      const total = bowl.price;
      if (mode === 'square') {
        showToast('💳 Square Profile Checkout', `Authorizing $${total.toFixed(2)} with Square.`);
      } else {
        showToast('👑 Added to Table Tab', `Bowl dispatched to staff for Table #${currentTable.num}.`);
      }
    }

    function requestCoalService() {
      showToast('🔥 Coal Alert Dispatched', `Staff alerted for Table #${currentTable.num}.`);
    }

    // ==================== ACCOUNT SYSTEM ====================
    function openAccountModal() {
      const container = document.getElementById('avatarPickerContainer');
      container.innerHTML = '';
      AVATARS.forEach(url => {
        const isSelected = (url === userAccount.avatar);
        const img = document.createElement('img');
        img.src = url;
        img.className = `w-10 h-10 rounded-full object-cover cursor-pointer transition ${isSelected ? 'ring-2 ring-purple-500 scale-105' : 'opacity-60 hover:opacity-100'}`;
        img.onclick = () => {
          userAccount.avatar = url;
          openAccountModal();
        };
        container.appendChild(img);
      });

      document.getElementById('accDisplayName').value = userAccount.name;
      document.getElementById('accHandle').value = userAccount.handle;
      document.getElementById('accPhone').value = userAccount.phone;
      document.getElementById('accountModal').classList.remove('hidden');
    }

    function closeAccountModal() {
      document.getElementById('accountModal').classList.add('hidden');
    }

    function handleSaveAccount(e) {
      e.preventDefault();
      userAccount.name = document.getElementById('accDisplayName').value.trim();
      userAccount.handle = document.getElementById('accHandle').value.trim();
      userAccount.phone = document.getElementById('accPhone').value.trim();
      
      document.getElementById('headerUserName').textContent = userAccount.name;
      document.getElementById('headerAvatarImg').src = userAccount.avatar;
      
      localStorage.setItem('empire_user_account', JSON.stringify(userAccount));
      closeAccountModal();
      showToast('✓ Profile Updated', `Saved profile for ${userAccount.name}.`);
    }

    // ==================== TABLE ROUTING ====================
    function openTableModal() { document.getElementById('tableModal').classList.remove('hidden'); }
    function closeTableModal() { document.getElementById('tableModal').classList.add('hidden'); }
    function setTable(num, name, pin) {
      currentTable = { num, name, pin };
      document.getElementById('currentTableDisplay').textContent = `Table #${num} (${name.split(' ')[0]})`;
      closeTableModal();
      showToast('📍 Table Selected', `Switched to Table #${num}.`);
    }

    function showToast(title, msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastIcon').textContent = title.split(' ')[0];
      document.getElementById('toastMsg').textContent = `${title.split(' ').slice(1).join(' ')}: ${msg}`;
      t.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
      t.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        t.classList.remove('opacity-100', 'translate-y-0');
        t.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
      }, 2200);
    }

    // PWA SW
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      const savedAcc = localStorage.getItem('empire_user_account');
      if (savedAcc) {
        userAccount = JSON.parse(savedAcc);
        document.getElementById('headerUserName').textContent = userAccount.name;
        document.getElementById('headerAvatarImg').src = userAccount.avatar;
      }
      initRotaryWheel();
      renderMixSummary();
    });
  </script>
</body>
</html>
